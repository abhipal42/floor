name: Floor
options:
  bundleIdPrefix: app.floor
  deploymentTarget:
    iOS: "17.2"
packages:
  FloorKit:
    path: FloorKit
targets:
  Floor:
    type: application
    platform: iOS
    sources: [Floor]
    dependencies:
      - package: FloorKit
        product: Models
      - package: FloorKit
        product: APIClient
      - package: FloorKit
        product: Onboarding
      - package: FloorKit
        product: VoteScreen
      - package: FloorKit
        product: BillScreen
      - package: FloorKit
        product: RepScreen
      - package: FloorKit
        product: Home
      - package: FloorKit
        product: DesignSystem
    # A generated Info.plist rather than GENERATE_INFOPLIST_FILE, because the API's base URL has to
    # be a build setting: a Debug build talks to the dev server, a Release build to the deployment.
    info:
      path: Floor/Info.plist
      properties:
        CFBundleDisplayName: Floor
        UILaunchScreen: {}
        FloorAPIBaseURL: $(FLOOR_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.floor.ios
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        debug:
          FLOOR_API_BASE_URL: http://localhost:8787
        release:
          FLOOR_API_BASE_URL: https://floor-api.vercel.app
schemes:
  Floor:
    build:
      targets:
        Floor: all
