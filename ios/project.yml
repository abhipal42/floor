name: Floor
options:
  bundleIdPrefix: app.floor
  deploymentTarget:
    iOS: "17.2"
# One version for the app and its widget extension: App Store Connect rejects an extension whose
# version differs from the app's. MARKETING_VERSION mirrors VERSION (the version-sync guard).
#
# FLOOR_BUNDLE_ID names the app; the widget is `$(FLOOR_BUNDLE_ID).widgets` and the App Group they
# share is `group.$(FLOOR_BUNDLE_ID)`. A personal device build on your own team overrides the one
# setting — `xcodebuild … FLOOR_BUNDLE_ID=com.yourname.floor` — and gets its own ids and its own
# group, instead of the app and widget colliding on one id or registering ours under your team.
settings:
  base:
    MARKETING_VERSION: "0.2.29"
    CURRENT_PROJECT_VERSION: "1"
    FLOOR_BUNDLE_ID: app.floor.ios
    FLOOR_APP_GROUP: group.$(FLOOR_BUNDLE_ID)
packages:
  FloorKit:
    path: FloorKit
targets:
  Floor:
    type: application
    platform: iOS
    sources: [Floor]
    dependencies:
      - package: FloorKit
        product: Models
      - package: FloorKit
        product: APIClient
      - package: FloorKit
        product: Onboarding
      - package: FloorKit
        product: VoteScreen
      - package: FloorKit
        product: BillScreen
      - package: FloorKit
        product: RepScreen
      - package: FloorKit
        product: Home
      - package: FloorKit
        product: DesignSystem
      - package: FloorKit
        product: WidgetFeed
      # The home-screen widgets, embedded in the app.
      - target: FloorWidgets
    # The App Group the widget reads the saved delegation from (district and members only; see
    # `UserDefaultsDelegationStore.shared`). The same setting is in FloorWidgets' entitlements.
    entitlements:
      path: Floor/Floor.entitlements
      properties:
        com.apple.security.application-groups: [$(FLOOR_APP_GROUP)]
    # A generated Info.plist rather than GENERATE_INFOPLIST_FILE, because the API's base URL has to
    # be a build setting: a Debug build talks to the dev server, a Release build to the deployment.
    info:
      path: Floor/Info.plist
      properties:
        CFBundleDisplayName: Floor
        UILaunchScreen: {}
        FloorAPIBaseURL: $(FLOOR_API_BASE_URL)
        # Read by `UserDefaultsDelegationStore.appGroup`, so Swift uses the group this build has.
        FloorAppGroup: $(FLOOR_APP_GROUP)
        # Without these XcodeGen writes its own defaults ("1.0", "1"), and the build shows 1.0
        # whatever MARKETING_VERSION says.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # floor://vote/<id>, which the widgets open (`FloorLink`).
        CFBundleURLTypes:
          - CFBundleURLName: $(FLOOR_BUNDLE_ID)
            CFBundleURLSchemes: [floor]
        # Onboarding's "Use my location": when-in-use only, one fix, never stored.
        NSLocationWhenInUseUsageDescription: Floor finds your congressional district from where you are, then forgets the location.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOOR_BUNDLE_ID)
        SWIFT_VERSION: "6.0"
      configs:
        debug:
          FLOOR_API_BASE_URL: http://localhost:8787
        release:
          FLOOR_API_BASE_URL: https://floor-api.vercel.app
  FloorWidgets:
    type: app-extension
    platform: iOS
    sources: [FloorWidgets]
    dependencies:
      - package: FloorKit
        product: Models
      - package: FloorKit
        product: APIClient
      - package: FloorKit
        product: Onboarding
      - package: FloorKit
        product: DesignSystem
      - package: FloorKit
        product: WidgetFeed
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: FloorWidgets/FloorWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(FLOOR_APP_GROUP)]
    info:
      path: FloorWidgets/Info.plist
      properties:
        CFBundleDisplayName: Floor
        FloorAPIBaseURL: $(FLOOR_API_BASE_URL)
        FloorAppGroup: $(FLOOR_APP_GROUP)
        # The same version as the app, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOOR_BUNDLE_ID).widgets
        SWIFT_VERSION: "6.0"
      configs:
        debug:
          FLOOR_API_BASE_URL: http://localhost:8787
        release:
          FLOOR_API_BASE_URL: https://floor-api.vercel.app
schemes:
  Floor:
    build:
      targets:
        Floor: all
        FloorWidgets: all
