# Guard configuration for Floor. Sourced by guards.sh — plain bash.
#
# Facts about THIS repo only. The shared logic is guards.sh, which `bootstrap`
# replaces on upgrade; this file is never overwritten. See guards.conf.example
# in RIA/templates/ci for what each knob does.

APP="."
APP_PREFIX="$(app_prefix "$APP")"

# The branch PRs merge into; a local run diffs against origin/$BASE_BRANCH.
BASE_BRANCH="main"

VERSION_FILE="VERSION"
VERSION_FIELDS=3
# MARKETING_VERSION in the XcodeGen spec is what TestFlight shows. It is the
# first three-field version in the file (iOS "17.2" and Swift "6.0" have two).
VERSION_MIRRORS="ios/project.yml"
CHANGELOG="CHANGELOG.md"
CHANGELOG_ARCHIVE_DIR="docs/changelog"
CHANGELOG_ARCHIVE_CMD="move the older MINOR series into docs/changelog/<x.y>.md"
RETRO_DIR="docs/retros"

# What counts as code: TypeScript under apps/*/src, apps/*/api and
# packages/*/src, the Swift sources, the XcodeGen spec and the migrations.
# `[^/.]+\.ts` (no dot before .ts) keeps *.test.ts out, so a test-only change
# is not asked for a doc.
CODE="^((apps|packages)/[^/]+/(src|api)/([^/]+/)*[^/.]+\.ts|ios/FloorKit/Sources/.*\.swift|ios/Floor/.*\.swift|ios/project\.yml|supabase/migrations/.*\.sql)$"

DOCS_CODE_PATTERN="$CODE"
DOCS_TARGET_PATTERN="^(docs/.*\.md|README\.md|CLAUDE\.md)$"
DOCS_HINT="  - state, setup, endpoints, data, lessons -> docs/HANDOFF.md
  - design, stack or milestone change      -> docs/plan.md (and docs/plan.html)"

# Migrations are code too: packages/db's tests apply every one against PGlite.
TESTS_CODE_PATTERN="$CODE"
TESTS_TARGET_PATTERN="\.test\.ts$|^ios/FloorKit/Tests/"

# Newly ADDED files that look like a new user-visible surface, used only to
# challenge a PATCH: a migration (new data), a new worker ingest source, or a
# new iOS screen. New API routes are added inside apps/api/src/app.ts, which no
# path can see — that call is the author's.
CAPABILITY_ADD_PATTERN="^supabase/migrations/.*\.sql$|^apps/worker/src/[^/.]+\.ts$|^ios/FloorKit/Sources/[^/]+/[^/]+View\.swift$"

RETRO_DEBT_MAX=8

# The repo is still on GitHub's default squash title (COMMIT_OR_PR_TITLE), so a
# single-commit PR squashes with its commit SUBJECT. Check it too.
PR_TITLE_CHECK_SUBJECT=1

ALLOW_COMMIT_TAGS=1

# Retired 2026-11-12: work used to be committed straight to main, which is the
# one path the guards never see. Every change now goes through a PR.
RETIRED_RULES="push(ed)? (it )?(straight |directly )?to \`?main\`?|CLAUDE.md (Shipping)"

SCOPE_RULES="node:^(apps|packages|supabase)/|^(package(-lock)?\.json|tsconfig[^/]*\.json|eslint\.config\.js|vitest\.config\.ts)$
ios:^ios/
ci_config:^\.github/"
# A DENY-list: paths that never need the test suite (emitted as `code`).
SCOPE_SKIP="^docs/|\.md$"
# Operative docs: read as instructions now. HANDOFF.md is the onboarding doc.
RETIRED_RULES_DOCS="(^|/)(CLAUDE|AGENTS|README|HANDOFF)\.md$"
