name: Ingest
#
# Keeps the database current. Until this workflow, nothing ran the worker on a
# schedule at all: every ingest_runs row in production was typed by hand, the
# last roll-call run was 2026-11-12 04:30 UTC, and /v1/status had read `stale`
# ever since (HANDOFF lesson 37).
#
# One job, one step after another, and one `concurrency` group with
# cancel-in-progress off: a run that is still going when the next is due makes
# the next one wait instead of overlapping it. Two ingests writing at once is
# what lesson 2 was about.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL      Supabase's session pooler string,
#                     postgres.<ref>@aws-1-us-east-1.pooler.supabase.com:5432
#                     (GitHub's runners have no IPv6, so not the direct host)
#   CONGRESS_API_KEY  the api.data.gov key, for bills and nominations
#   ANTHROPIC_API_KEY for campaign promises and news tone (optional: without it those skip)
#   OPENSTATES_API_KEY state bills for the Local tab (optional: without it states skip)
#   NYC_LEGISTAR_TOKEN NYC Council records (optional: without it NYC skips)
# Without DATABASE_URL the job says so and stops, rather than failing every hour.
#
# GitHub turns a schedule off after 60 days with no activity in a public repo,
# and says so only by email. If /v1/status goes stale with no error, check that
# this workflow is still enabled (Actions -> Ingest).
on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest. The 06 UTC slot is its own
    # entry so the Members step can tell it apart (github.event.schedule names the cron that fired).
    - cron: "17 0-5,7-23 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The secrets live in the repo's `fafo` environment, not at repo level; without this the job
    # sees neither and skips (lesson 71). The environment has no protection rules, so the hourly run
    # never waits on a reviewer.
    environment: fafo
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      # Campaign promises only (one Claude call a member). Until it is set, that step skips.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The Local tab (v0.2.60). Each is optional: the local step logs what it skipped.
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      NYC_LEGISTAR_TOKEN: ${{ secrets.NYC_LEGISTAR_TOKEN }}
    steps:
      - name: Secrets present
        id: secrets
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping ingest"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # Members once a day, at the 06 UTC run (or on a manual run): the roster changes on swearing-ins,
      # not by the hour. Note the cost: a member sworn in after that day's run has their positions
      # skipped (and counted in the log) until the next one, and nothing re-fetches a vote that has
      # *some* positions. After a swearing-in, run this workflow by hand.
      - name: Members
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *')
        run: npm run ingest -w @floor/worker -- members
      # The chambers one after the other, never together. Each source still runs when an earlier one
      # failed (`!cancelled()`), since a failure in one says nothing about the others; the job goes red.
      - name: House roll calls
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- rollcalls house current
      - name: Senate roll calls
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- rollcalls senate current
      # Bills and nominations only fetch what new votes refer to, so these are quick when nothing changed.
      - name: Bills
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && !cancelled()
        run: npm run ingest -w @floor/worker -- bills
      - name: Nominations
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && !cancelled()
        run: npm run ingest -w @floor/worker -- nominations
      # The week ahead: the House's weekly floor list for this week and next, the Senate's next
      # convening (senate.gov), and its Daily Digest program (Congress.gov + govinfo; 2 requests on the
      # key). Before the bill catalog, so the catalog's budget cannot starve it.
      - name: Schedule
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- schedule
      # Every bill of the Congress, not only voted ones (v0.2.26). Bounded: at most 1,200 Congress.gov
      # requests a run, paced to 4,500 an hour, so with the steps above it stays inside the key's
      # 5,000 an hour (about 16 minutes when the budget is all used). Incremental from the last
      # listing; the 06 UTC run and manual runs re-list in full (~80 requests), which repairs anything
      # offset paging skipped while the list shifted. Until the one-time backfill is done (~46,000
      # requests), each run spends its whole budget on it: about 38 runs. HANDOFF has the details.
      # Financial disclosures (House Clerk, Senate eFD), once a day in the 06 UTC run and on manual
      # runs. Only new filings cost requests; 150 a chamber, 1.5 s apart. Floor's §13107 basis (free to
      # the public, never paid, no ads beside this data) is in HANDOFF, "Financial disclosures".
      - name: House disclosures
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- disclosures house --budget 150
      - name: Senate disclosures
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- disclosures senate --budget 150
      # Paper filings someone transcribed (apps/worker/transcriptions, lesson 73), after both listings
      # so a filing listed today is filled today. Idempotent: a reload replaces the filing's rows.
      - name: Transcribed paper filings
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- transcriptions
      # Members-elect, once a day: the Senate races as the AP called them (apps/worker/elections,
      # reviewed in a diff), then the House Clerk's member-elect list (it 404s until late December,
      # which is a clean "not published yet"), their FEC totals, and House elects' candidate reports.
      # The API stops serving all of it on January 3, when congress-legislators takes over.
      - name: Senate races (AP calls)
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- elections
      - name: House members-elect (Clerk)
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- members-elect-house 120
      - name: Members-elect FEC totals
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- fec-elect
      - name: Members-elect candidate reports
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- elect-disclosures --budget 50
      # Official accounts once a day (congress-legislators' social file, and a Bluesky account only
      # when Bluesky verified it): ~540 Bluesky searches, free and keyless.
      - name: Social accounts
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- social
      # Members' recent posts every hour: YouTube channel feeds, Bluesky author feeds and the
      # Mastodon accounts. Free, no keys; kept 30 days, at most 30 a member.
      - name: Posts
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- posts
      # Campaign promises once a day, 25 members a run (one Claude call each, at most; about 22 runs
      # to cover everyone once), only members not yet checked. Skips without ANTHROPIC_API_KEY.
      - name: Campaign promises
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && env.ANTHROPIC_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- promises --budget 25
      # Members' headlines every hour (v0.2.60): Google News RSS for the 100 members checked longest
      # ago, none more often than every 12 h, 1.2 s apart (~2 minutes). With ANTHROPIC_API_KEY, one
      # Claude call per member with new headlines, for tone and stories; without it, headlines only.
      - name: News
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- news --budget 100
      # Polls naming members (apps/worker/polls, reviewed in PRs), once a day. Idempotent.
      - name: Polls
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- polls
      # The Local tab, once a day: Open States (OPENSTATES_API_KEY; at most 150 requests, 7 s apart),
      # Legistar for the cities (NYC with NYC_LEGISTAR_TOKEN), and 59 Google News queries.
      - name: Local
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *') && !cancelled()
        run: npm run ingest -w @floor/worker -- local
      - name: Bill catalog
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && !cancelled()
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          full=""
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHEDULE" = "17 6 * * *" ]; then full="--full"; fi
          npm run ingest -w @floor/worker -- bill-catalog --budget 1200 $full
