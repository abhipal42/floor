name: Ingest
#
# Keeps the database current. Until this workflow, nothing ran the worker on a
# schedule at all: every ingest_runs row in production was typed by hand, the
# last roll-call run was 2026-11-12 04:30 UTC, and /v1/status had read `stale`
# ever since (HANDOFF lesson 37).
#
# One job, one step after another, and one `concurrency` group with
# cancel-in-progress off: a run that is still going when the next is due makes
# the next one wait instead of overlapping it. Two ingests writing at once is
# what lesson 2 was about.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL      Supabase's session pooler string,
#                     postgres.<ref>@aws-1-us-east-1.pooler.supabase.com:5432
#                     (GitHub's runners have no IPv6, so not the direct host)
#   CONGRESS_API_KEY  the api.data.gov key, for bills and nominations
# Without DATABASE_URL the job says so and stops, rather than failing every hour.
#
# GitHub turns a schedule off after 60 days with no activity in a public repo,
# and says so only by email. If /v1/status goes stale with no error, check that
# this workflow is still enabled (Actions -> Ingest).
on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest. The 06 UTC slot is its own
    # entry so the Members step can tell it apart (github.event.schedule names the cron that fired).
    - cron: "17 0-5,7-23 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - name: Secrets present
        id: secrets
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping ingest"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # Members once a day, at the 06 UTC run (or on a manual run): the roster changes on swearing-ins,
      # not by the hour. Note the cost: a member sworn in after that day's run has their positions
      # skipped (and counted in the log) until the next one, and nothing re-fetches a vote that has
      # *some* positions. After a swearing-in, run this workflow by hand.
      - name: Members
        if: steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *')
        run: npm run ingest -w @floor/worker -- members
      # The chambers one after the other, never together. Each source still runs when an earlier one
      # failed (`!cancelled()`), since a failure in one says nothing about the others; the job goes red.
      - name: House roll calls
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- rollcalls house current
      - name: Senate roll calls
        if: steps.install.outcome == 'success' && !cancelled()
        run: npm run ingest -w @floor/worker -- rollcalls senate current
      # Bills and nominations only fetch what new votes refer to, so these are quick when nothing changed.
      - name: Bills
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && !cancelled()
        run: npm run ingest -w @floor/worker -- bills
      - name: Nominations
        if: steps.install.outcome == 'success' && env.CONGRESS_API_KEY != '' && !cancelled()
        run: npm run ingest -w @floor/worker -- nominations
