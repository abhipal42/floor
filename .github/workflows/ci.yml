name: CI
#
# Runs on the trunk only, by the owner's decision on 2026-11-13: no
# `pull_request` trigger, so nothing here compiles or tests a PR before it
# merges. The guards still run on every PR (guards.yml, template-owned), but
# they read git and metadata — they never build the code.
#
# What that moves onto you: `npm run check` and, for anything under `ios/`,
# `swift test --package-path ios/FloorKit` before you open the PR. They are the
# gate now; see CLAUDE.md › Before every PR. A failure that used to turn a PR
# red lands on `main` instead and is found here, after the fact.
#
# `node` runs on every push. `ios` runs only when the push touched `ios/` or
# `.github/` — see the `scope` job.
on:
  push:
    branches: [main]

jobs:
  # Which parts of the tree this push touched, so `ios` can sit out the pushes
  # that cannot affect it. The rules live in ONE place — SCOPE_RULES in
  # .github/scripts/guards.conf, where `ios:^ios/` already defines it for the
  # guards — rather than a second copy as a `paths:` filter here that would
  # drift from it. guards.yml computes the same outputs for PRs, but GitHub has
  # no cross-workflow `needs:`, so this workflow runs `guards.sh scope` itself.
  #
  # It costs one ubuntu runner start (~15s) on every push to spare a macOS job
  # that takes 1-3 minutes and queues for longer.
  scope:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
      ci_config: ${{ steps.scope.outputs.ci_config }}
    steps:
      - uses: actions/checkout@v7
        with:
          # guards.sh scope diffs against the merge base, which does not exist
          # in a shallow clone — without this every file reads as changed.
          fetch-depth: 0
          persist-credentials: false
      - name: scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Three ways there is no base to diff against: unset, the all-zeroes
          # first push, and a SHA that is real but GONE after a force-push.
          # Any of them means "assume everything changed" — skipping the build
          # because we could not tell is the one failure mode worth avoiding.
          if [ -z "${BASE_SHA:-}" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "no usable base — treating everything as changed"
            for k in ios ci_config; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # Let the shared rules decide first, into a scratch file so their
          # answer can be refined before it becomes this job's output. The
          # human-readable half still prints to the log.
          out=$(mktemp)
          GITHUB_OUTPUT="$out" bash .github/scripts/guards.sh scope
          ios=$(grep '^ios=' "$out" | tail -1 | cut -d= -f2)
          ci_config=$(grep '^ci_config=' "$out" | tail -1 | cut -d= -f2)

          # `ios:^ios/` is true on EVERY release, because version-sync requires
          # MARKETING_VERSION in ios/project.yml to mirror VERSION — so a
          # docs-only PR touches ios/ too, and an unrefined gate would never
          # skip anything. Discount the mirror: ios/ counts as changed when
          # some file other than project.yml changed, or when project.yml
          # changed by more than its MARKETING_VERSION line.
          if [ "$ios" = "true" ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            others=$(grep -E '^ios/' <<< "$changed" | grep -vE '^ios/project\.yml$' || true)
            if [ -n "$others" ]; then
              echo "ios/ changed beyond project.yml:"; printf '%s\n' "$others" | sed -n '1,5p'
            elif git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- ios/project.yml \
                 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                 | grep -qvE '^[+-][[:space:]]*MARKETING_VERSION:'; then
              echo "ios/project.yml changed beyond MARKETING_VERSION."
            else
              echo "only the MARKETING_VERSION mirror under ios/ — skipping the macOS job."
              ios=false
            fi
          fi

          echo "ios=$ios"             >> "$GITHUB_OUTPUT"
          echo "ci_config=$ci_config" >> "$GITHUB_OUTPUT"
          echo "→ ios=$ios ci_config=$ci_config"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Landing page builds
        run: npm run build -w @floor/web
      - name: Committed OpenAPI document matches the routes
        run: |
          npm run openapi -w @floor/api
          git diff --exit-code -- apps/api/openapi.json

  ios:
    # Only when the push touched ios/ — or .github/, so a change to this
    # workflow still proves the job it is changing. Everything else (API,
    # worker, web, docs, migrations) cannot affect a Swift build, and this is
    # the slowest and scarcest runner we use.
    needs: scope
    if: needs.scope.outputs.ios == 'true' || needs.scope.outputs.ci_config == 'true'
    # macos-latest (macOS 26) rather than a pinned macos-15: two runs in a row were cancelled after
    # waiting 15 minutes without ever being assigned a macos-15 runner, and macOS 26 also matches the
    # Xcode 27 / Swift 6.4 toolchain this code is written against locally.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Swift package tests
        run: swift test --package-path ios/FloorKit
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild build \
            -project ios/Floor.xcodeproj \
            -scheme Floor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      # The image references in ios/FloorKit/Tests/SnapshotTests are recorded on the iOS 26.2
      # simulator with Xcode 26.2, and an image depends on the iOS that drew it. So this step selects
      # /Applications/Xcode_26.2.app explicitly rather than whatever macos-latest defaults to, and
      # FAILS — never skips — when that Xcode or a 26.2 iPhone simulator is missing: a step that
      # quietly passes without checking anything is how a broken screen reaches main. When it fails
      # for that reason, re-record on the runner's runtime in one PR (HANDOFF, M2, "Snapshot tests").
      # After the app build, so a snapshot failure never hides whether the app compiles.
      - name: Snapshot tests (iOS 26.2 simulator)
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
          # xcodebuild hands the test runner only variables prefixed TEST_RUNNER_.
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: |
          set -euo pipefail
          howto="Re-record the references on this runner's runtime: docs/HANDOFF.md, M2, \"Snapshot tests\"."
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error title=Snapshot tests::No Xcode 26.2 on this runner (/Applications/Xcode_26.2.app). Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' '). $howto"
            exit 1
          fi
          # The device the references were drawn on first, then any iPhone on the 26.2 runtime.
          udid=$(xcrun simctl list devices available -j \
            | jq -r '(.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"] // [])
                     | map(select(.name | startswith("iPhone")))
                     | ((map(select(.name == "iPhone 17 Pro")) + .) | .[0].udid) // empty')
          if [ -z "$udid" ]; then
            echo "::error title=Snapshot tests::No iOS 26.2 iPhone simulator with $(xcodebuild -version | head -1). $howto"
            exit 1
          fi
          echo "Simulator: $(xcrun simctl list devices available | grep "$udid")"
          cd ios/FloorKit
          xcodebuild test -scheme FloorKit-Package -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:SnapshotTests -quiet
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore
