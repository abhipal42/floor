name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Committed OpenAPI document matches the routes
        run: |
          npm run openapi -w @floor/api
          git diff --exit-code -- apps/api/openapi.json

  ios:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path ios/FloorKit
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild build \
            -project ios/Floor.xcodeproj \
            -scheme Floor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
